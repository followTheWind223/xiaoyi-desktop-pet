[package]
name = "desktop-pet-console"
version = "0.1.0"
description = "Agent desktop pet control console"
authors = ["Desktop Pet Team"]
edition = "2021"

[lib]
name = "desktop_pet_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
